[package]
name = "neomacs-video-gstreamer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime-loaded GStreamer video backend for Neomacs"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "linux")'.dependencies]
crossbeam-channel.workspace = true
gstreamer = { workspace = true, features = ["v1_24"] }
gstreamer-allocators = { workspace = true, features = ["v1_24"] }
gstreamer-app = { workspace = true, features = ["v1_24"] }
gstreamer-video = { workspace = true, features = ["v1_24"] }
libc.workspace = true
neomacs-display-protocol.workspace = true
neomacs-video-backend-abi.workspace = true
neomacs-video-model.workspace = true

[lints]
workspace = true
