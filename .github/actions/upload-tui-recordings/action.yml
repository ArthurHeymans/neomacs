name: Upload Neomacs TUI recordings
description: Publish asciicast artifacts emitted by the TUI test harness.

inputs:
  artifact-name:
    description: Unique artifact name for this workflow run and shard.
    required: true

runs:
  using: composite
  steps:
    - name: Upload TUI recordings
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: target/tui-recordings
        if-no-files-found: ignore
        retention-days: 14
