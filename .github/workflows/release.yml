name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: build AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            cmake \
            m4 \
            libgmp-dev \
            libssl-dev \
            fontconfig \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev \
            mesa-vulkan-drivers \
            libvulkan-dev \
            libdbus-1-dev \
            libsystemd-dev \
            libsqlite3-dev \
            libxml2-dev \
            gnutls-bin \
            libgnutls28-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install linuxdeploy
        uses: AnimMouse/setup-appimage@v2
        with:
          filename: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          cache_key: continuous

      - name: Install appimagetool
        uses: AnimMouse/setup-appimage@v2
        with:
          filename: appimagetool
          url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          cache_key: continuous

      - name: Build release binaries
        run: cargo xtask fresh-build --release

      - name: Package AppImage
        run: ./scripts/package-appimage.sh --skip-build --no-smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/neomacs-linux-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
