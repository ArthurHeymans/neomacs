name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_LOG: info

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            cmake \
            m4 \
            libssl-dev \
            fontconfig \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev \
            mesa-vulkan-drivers \
            libvulkan-dev \
            libdbus-1-dev \
            libsystemd-dev \
            libsqlite3-dev \
            libxml2-dev \
            gnutls-bin \
            libgnutls28-dev \
            rpm

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install linuxdeploy
        uses: AnimMouse/setup-appimage@v2
        with:
          filename: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          cache_key: continuous

      - name: Install appimagetool
        uses: AnimMouse/setup-appimage@v2
        with:
          filename: appimagetool
          url: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          cache_key: continuous

      - name: Build release binaries
        run: cargo xtask fresh-build --release

      - name: Package AppImage
        run: ./scripts/package-appimage.sh --skip-build --no-smoke

      - name: Package .deb
        run: ./scripts/package-deb.sh --skip-build --no-smoke

      - name: Package .rpm
        run: ./scripts/package-rpm.sh --skip-build --no-smoke

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  build-macos:
    name: build macOS
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GSTREAMER_VERSION: 1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies (brew)
        run: brew install pkg-config gstreamer

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-aarch64
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Build and package .app + .dmg
        run: ./scripts/package-macos-app.sh --no-smoke

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: build Windows
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      GSTREAMER_VERSION: 1.26.9
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install GStreamer SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          $runtime = "$env:RUNNER_TEMP\gstreamer-runtime.msi"
          $devel = "$env:RUNNER_TEMP\gstreamer-devel.msi"
          Invoke-WebRequest -Uri "$baseUrl/gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi" -OutFile $runtime
          Invoke-WebRequest -Uri "$baseUrl/gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi" -OutFile $devel
          $installRoot = "C:\gstreamer"
          Start-Process msiexec.exe -Wait -ArgumentList @("/i", $runtime, "/qn", "INSTALLLEVEL=1000", "INSTALLDIR=$installRoot")
          Start-Process msiexec.exe -Wait -ArgumentList @("/i", $devel, "/qn", "INSTALLLEVEL=1000", "INSTALLDIR=$installRoot")
          $searchRoots = @("C:\gstreamer", "${env:ProgramFiles}\gstreamer", "${env:ProgramFiles(x86)}\gstreamer") |
            Where-Object { Test-Path $_ }
          $glibPc = $searchRoots |
            ForEach-Object { Get-ChildItem -Path $_ -Filter glib-2.0.pc -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $glibPc) {
            $searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Depth 4 -ErrorAction SilentlyContinue }
            throw "glib-2.0.pc not found after installing GStreamer devel MSI"
          }
          $pkgConfigDir = Split-Path -Parent $glibPc.FullName
          $libDir = Split-Path -Parent $pkgConfigDir
          $gstRoot = Split-Path -Parent $libDir
          $pkgConfig = "$gstRoot\bin\pkg-config.exe"
          if (-not (Test-Path $pkgConfig)) {
            choco install pkgconfiglite -y
            $pkgConfig = (Get-Command pkg-config.exe -All |
              Where-Object { $_.Source -notmatch "\\Git\\" } |
              Select-Object -First 1 -ExpandProperty Source)
            if (-not $pkgConfig) {
              throw "pkg-config.exe not found after installing pkgconfiglite"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $pkgConfig)
          Add-Content -Path $env:GITHUB_PATH -Value "$gstRoot\bin"
          Add-Content -Path $env:GITHUB_ENV -Value "GSTREAMER_ROOT_X86_64=$gstRoot\"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG=$pkgConfig"
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_ENV -Value "GSTREAMER_RUNTIME_MSI=$runtime"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-x86_64
          cache-bin: false
          save-if: true
          cache-on-failure: true

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Verify GStreamer pkg-config
        shell: bash
        run: source scripts/windows-gstreamer-env.sh --verify

      - name: Build release binaries
        shell: bash
        timeout-minutes: 150
        run: |
          source scripts/windows-gstreamer-env.sh
          cargo xtask fresh-build --release

      - name: Package .exe installer
        shell: bash
        timeout-minutes: 20
        run: |
          source scripts/windows-gstreamer-env.sh
          ./scripts/package-windows-installer.sh --skip-build --no-smoke

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  create-release:
    name: create release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEO Emacs ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
