name: ci

on:
  push: {}
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: required checks (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            cmake \
            m4 \
            libssl-dev \
            fontconfig \
            libfontconfig1-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev \
            mesa-vulkan-drivers \
            libvulkan-dev \
            libdbus-1-dev \
            libsystemd-dev \
            libsqlite3-dev \
            libxml2-dev \
            gnutls-bin \
            libgnutls28-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain-file: rust-toolchain.toml

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check workspace
        run: cargo check --workspace

      - name: neovm-core tests
        run: cargo nextest run -p neovm-core --no-fail-fast

      - name: fresh release build
        run: cargo xtask fresh-build --release

      - name: neovm-oracle-tests
        run: cargo nextest run -p neovm-oracle-tests --no-fail-fast

  check-unix:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
            cache-key: linux-check-x86_64
            install-deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libfontconfig1-dev pkg-config
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
            cache-key: linux-check-aarch64
            install-deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libfontconfig1-dev pkg-config
          - runner: macos-latest
            label: macos-aarch64
            cache-key: macos-check-aarch64
            install-deps: brew install pkg-config fontconfig
    name: cargo check (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: ${{ matrix.install-deps }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        run: cargo check --no-default-features -p neomacs -p neovm-core

  check-windows-msvc:
    if: github.event_name == 'workflow_dispatch'
    name: cargo check (windows-msvc-x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        run: cargo check --no-default-features -p neomacs -p neovm-core

  check-windows-gnu:
    if: false  # Disabled: MSVC is the preferred Windows toolchain for distribution
    name: cargo check (windows-gnu-x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (1.95.0-gnu)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0-x86_64-pc-windows-gnu

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: powershell
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_PATH -Value "$msys2\mingw64\bin"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        run: cargo check --no-default-features -p neomacs -p neovm-core --target x86_64-pc-windows-gnu
