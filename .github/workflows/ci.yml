name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
            cache-key: linux-check-x86_64
            install-deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libgmp-dev libfontconfig1-dev pkg-config
          - runner: ubuntu-24.04-arm
            label: linux-aarch64
            cache-key: linux-check-aarch64
            install-deps: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libgmp-dev libfontconfig1-dev pkg-config
          - runner: macos-latest
            label: macos-aarch64
            cache-key: macos-check-aarch64
            install-deps: brew install gmp pkg-config fontconfig
    name: cargo check (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: ${{ matrix.install-deps }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        run: cargo check --no-default-features -p neomacs -p neovm-core

  check-windows-msvc:
    name: cargo check (windows-msvc-x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg GMP
        id: cache-vcpkg-gmp
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-gmp-x64-windows-static-v1

      - name: Install GMP via vcpkg
        if: steps.cache-vcpkg-gmp.outputs.cache-hit != 'true'
        run: vcpkg install gmp:x64-windows-static

      - name: Set pkg-config path for vcpkg
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows-static\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        env:
          PKG_CONFIG_PATH: "C:\\vcpkg\\installed\\x64-windows-static\\lib\\pkgconfig"
        run: cargo check --no-default-features -p neomacs -p neovm-core

  check-windows-gnu:
    if: false  # Disabled: MSVC is the preferred Windows toolchain for distribution
    name: cargo check (windows-gnu-x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (1.95.0-gnu)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0-x86_64-pc-windows-gnu

      - name: Setup MSYS2 and install MinGW GMP
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: powershell
        run: |
          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          Add-Content -Path $env:GITHUB_PATH -Value "$msys2\mingw64\bin"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: cargo check
        run: cargo check --no-default-features -p neomacs -p neovm-core --target x86_64-pc-windows-gnu
