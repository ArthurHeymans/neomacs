name: windows

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MSVC target — install GMP via vcpkg, then build with the default target.
  msvc:
    name: cargo check (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg GMP
        id: cache-vcpkg-gmp
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed\x64-windows-static
          key: vcpkg-gmp-x64-windows-static-v1

      - name: Install GMP via vcpkg
        if: steps.cache-vcpkg-gmp.outputs.cache-hit != 'true'
        run: vcpkg install gmp:x64-windows-static

      - name: Set pkg-config path for vcpkg
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows-static\lib\pkgconfig"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check neomacs on Windows (MSVC)
        env:
          PKG_CONFIG_PATH: "C:\\vcpkg\\installed\\x64-windows-static\\lib\\pkgconfig"
        run: cargo check --workspace --exclude neomacs-tui-tests --exclude neomacs-melpa-tests --exclude neovm-oracle-tests

  # MinGW target — install GMP via MSYS2, then build with x86_64-pc-windows-gnu.
  mingw:
    name: cargo check (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup MSYS2 and install MinGW GMP
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-pkg-config

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-gnu-x86_64
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check neomacs on Windows (MinGW)
        run: cargo check --workspace --exclude neomacs-tui-tests --exclude neomacs-melpa-tests --exclude neovm-oracle-tests --target x86_64-pc-windows-gnu
