[package]
name = "neomacs-diagnostics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing.workspace = true
# Pure-Rust flamegraph renderer (folded stacks -> SVG). CLI/nameattr features
# are off; we only use the library flamegraph::from_lines path.
inferno = { version = "0.12", default-features = false }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "macros", "io-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
