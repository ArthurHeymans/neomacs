<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">NEO Emacs social preview</title>
  <desc id="desc">A blue and orange taijitu mark with two lambda symbols beside the NEO Emacs wordmark and the tagline The future of Emacs.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111c"/>
      <stop offset="52%" stop-color="#101823"/>
      <stop offset="100%" stop-color="#15120e"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 280) rotate(18) scale(340 260)">
      <stop offset="0%" stop-color="#17b7ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#17b7ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orangeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(730 380) rotate(-12) scale(430 260)">
      <stop offset="0%" stop-color="#ff9f2e" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff9f2e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmarkGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#77f7ff"/>
      <stop offset="34%" stop-color="#b8fff0"/>
      <stop offset="68%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#ff8f45"/>
    </linearGradient>

    <linearGradient id="emacsGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#d9fbff"/>
      <stop offset="72%" stop-color="#ffe7bd"/>
      <stop offset="100%" stop-color="#ffb15f"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#19b8ff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#19b8ff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ff9f2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff9f2e" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>

    <filter id="wordGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fb7cc" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>

    <clipPath id="taijituClip">
      <circle cx="0" cy="0" r="184"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.85"/>
  <rect width="1280" height="640" fill="url(#blueGlow)"/>
  <rect width="1280" height="640" fill="url(#orangeGlow)"/>

  <g opacity="0.42">
    <path d="M0 500L250 280L510 640H0Z" fill="#102a3a"/>
    <path d="M830 0H1280V640H1010L720 250Z" fill="#281d14"/>
    <path d="M210 88H1110" stroke="url(#lineGradient)" stroke-width="2"/>
    <path d="M210 552H1110" stroke="url(#lineGradient)" stroke-width="2"/>
  </g>

  <g transform="translate(142 106) scale(10)" filter="url(#softShadow)">
    <circle cx="20" cy="20" r="20" fill="#07101a" opacity="0.62"/>
    <circle cx="20" cy="20" r="18.5" fill="#16aee8" stroke="#07101a" stroke-width="1.1"/>
    <path
      d="M20 1.5 a18.5 18.5 0 0 1 0 37 a9.25 9.25 0 0 1 0 -18.5 a9.25 9.25 0 0 0 0 -18.5 Z"
      fill="#ff9900"/>
    <circle cx="20" cy="20" r="18.5" fill="none" stroke="#d7f6ff" stroke-opacity="0.34" stroke-width="0.42"/>
    <text
      x="16"
      y="18"
      text-anchor="middle"
      font-size="16.5"
      font-weight="700"
      fill="#0d0d12"
      font-family="JetBrains Mono, Cascadia Code, Menlo, Consolas, monospace"
      transform="rotate(225 16 12)">λ</text>
    <text
      x="16"
      y="18"
      text-anchor="middle"
      font-size="16.5"
      font-weight="700"
      fill="#0d0d12"
      font-family="JetBrains Mono, Cascadia Code, Menlo, Consolas, monospace"
      transform="rotate(180 20 20) rotate(225 16 12)">λ</text>
  </g>

  <g transform="translate(570 0)">
    <text x="0" y="282"
          font-family="IBM Plex Sans Condensed, IBM Plex Sans, Inter, Segoe UI, sans-serif"
          font-size="172"
          font-weight="800"
          letter-spacing="0"
          fill="url(#wordmarkGradient)"
          filter="url(#wordGlow)">NEO</text>
    <text x="0" y="428"
          font-family="IBM Plex Sans Condensed, IBM Plex Sans, Inter, Segoe UI, sans-serif"
          font-size="150"
          font-weight="780"
          letter-spacing="0"
          fill="url(#emacsGradient)"
          filter="url(#wordGlow)">Emacs</text>
    <rect x="5" y="456" width="610" height="4" rx="2" fill="url(#lineGradient)"/>
  </g>

  <g transform="translate(570 520)">
    <rect x="0" y="-48" width="492" height="78" rx="18" fill="#0b141f" fill-opacity="0.74" stroke="#86dfff" stroke-opacity="0.18"/>
    <text x="246" y="3"
          font-family="JetBrains Mono, Cascadia Code, Menlo, Consolas, monospace"
          font-size="34"
          font-weight="650"
          text-anchor="middle"
          fill="#ffd2a1">The future of Emacs</text>
  </g>
</svg>
