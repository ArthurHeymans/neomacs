[package]
name = "neovm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime structures for NeoVM"

[dependencies]
neovm-host-abi.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
notify.workspace = true
fs4.workspace = true
sysinfo.workspace = true
regex.workspace = true
rustc-hash.workspace = true
aes.workspace = true
cbc.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
getrandom.workspace = true
base64.workspace = true
num_enum.workspace = true
strum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
tracing-appender.workspace = true
stacker.workspace = true
dns-lookup.workspace = true
hostname.workspace = true
network-interface.workspace = true
libloading.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
serde.workspace = true
bytemuck.workspace = true
memmap2.workspace = true
tempfile.workspace = true
polling.workspace = true
portable-pty.workspace = true
smallvec.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true
parking_lot.workspace = true
malachite.workspace = true
itoa.workspace = true
unicode_names2.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
rusqlite.workspace = true
quick-xml.workspace = true
tl.workspace = true
rodio = { version = "0.20", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
default = []
sound = ["rodio"]
# Tiered JIT execution subsystem (src/emacs_core/jit.rs +
# bytecode/ELISP_VM_MODERNIZATION.md). Under construction; default OFF so
# production is byte-for-byte unchanged. Build/test with `--features jit`.
jit = []

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
proptest.workspace = true
tree-sitter-json = "0.24"

[build-dependencies]
sha2.workspace = true

[[bench]]
name = "buffer_text_backends"
harness = false

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
