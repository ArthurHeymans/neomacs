[package]
name = "neomacs-melpa-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# Packages are installed through neomacs's own `package-install` over the
# network (not fetched from Rust), so no HTTP/tar deps are needed — only an
# isolated temp `$HOME` per test.
tempfile = "3"
